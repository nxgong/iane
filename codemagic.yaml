workflows:
  ios-workflow:
    name: iOS Workflow

    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.easisoft.ianelab002

    scripts:

      - name: Fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.easisoft.ianelab002 --type IOS_APP_STORE --create

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build iOS
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa