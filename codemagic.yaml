workflows:
  ios-workflow:
    name: iOS App Store Build

    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Apple API


    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.easisoft.ianelab002


    triggering:
      events:
        - push

      branch_patterns:
        - pattern: main
          include: true
          source: true


    scripts:

      - name: Get Flutter packages
        script: |
          flutter pub get


      - name: Install Pods
        script: |
          cd ios
          pod install


      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles


      - name: Build IPA
        script: |
          flutter build ipa --release



    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive


    publishing:

      app_store_connect:

        auth: integration

        submit_to_testflight: true