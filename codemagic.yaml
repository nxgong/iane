workflows:
  ios-workflow:
    name: iOS App Store Build

    instance_type: mac_mini_m2

    integrations:
      app_store_connect: AppStoreUpload

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.easisoft.ianelab002

    triggering:
      events:
        - push

      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Setup iOS signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true